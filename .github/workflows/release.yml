name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    name: Build and publish release binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build frontend (required by go:embed)
        working-directory: web
        run: |
          npm ci
          npm run build

      - name: Build binaries
        run: |
          set -euo pipefail
          mkdir -p release
          for target in linux/amd64 linux/arm64 windows/amd64; do
            os="${target%/*}"
            arch="${target#*/}"
            name="hermes-console-${os}-${arch}"
            if [ "$os" = "windows" ]; then
              name="${name}.exe"
            fi
            echo "Building ${name}"
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" \
              go build -trimpath -ldflags='-s -w' -o "release/${name}" ./cmd/console
          done
          cd release
          sha256sum hermes-console-* > checksums.txt
          ls -la

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
